<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SCRUB — kill the metadata, keep the pixels</title>
    <meta name="description" content="Strip GPS, EXIF and every hidden tag from your images. 100% in your browser. Nothing uploads." />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="orbs" aria-hidden="true"><i class="o1"></i><i class="o2"></i><i class="o3"></i></div>

    <main class="panel">
      <header>
        <div>
          <h1>SCRUB</h1>
          <p>kill the metadata. keep the pixels.</p>
        </div>
        <div class="lock" title="nothing leaves your browser">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <span>IN-BROWSER<br/>ONLY</span>
        </div>
      </header>

      <section id="stage">
        <!-- idle -->
        <div class="state" id="state-idle">
          <button class="dropzone" id="dropzone">
            <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5-9 9"/></svg>
            <strong>DROP AN IMAGE</strong>
            <span>or tap to pick &middot; or paste it</span>
          </button>
          <input type="file" id="file-input" accept="image/*" hidden />
        </div>

        <!-- loaded -->
        <div class="state hidden" id="state-loaded">
          <div class="split">
            <div class="thumb"><img id="preview" alt="your image" /></div>
            <div class="findings">
              <div class="findings-head"><span id="tag-count">0</span> TAGS FOUND</div>
              <ul id="tag-list"></ul>
            </div>
          </div>
          <button class="big-btn kill" id="scrub-btn">SCRUB IT</button>
        </div>

        <!-- done -->
        <div class="state hidden" id="state-done">
          <div class="verdict">
            <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#3cff6e" stroke-width="2.6"><path d="M4 12l6 6L20 6"/></svg>
            <div><strong id="removed-count">0</strong> TAGS REMOVED<br/><span>0 remain. verified.</span></div>
          </div>
          <div class="sizes"><span id="size-before"></span><span class="arrow">&rarr;</span><span id="size-after"></span></div>
          <div class="row">
            <button class="big-btn" id="download-btn">DOWNLOAD</button>
            <button class="ghost-btn" id="again-btn">AGAIN</button>
          </div>
        </div>

        <!-- error -->
        <div class="state hidden" id="state-error">
          <p class="err" id="err-msg">couldn't read that file.</p>
          <button class="ghost-btn" id="retry-btn">TRY ANOTHER</button>
        </div>
      </section>

      <footer>
        <span>embedded data only. pixels can still be analyzed.</span>
        <a href="https://wearedogs.net" target="_blank" rel="noopener"><img src="./sticker.webp" alt="This product was made by DOGS" /></a>
      </footer>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
